# Paper 마인크래프트 서버
# 사양: docs/design/systems/01-server.md, 포트 규칙: docs/design/systems/02-network.md
# 값은 .env에서 읽는다 (.env.example 참고).

services:
  mc:
    # 이미지는 릴리스 태그로 고정. 올리는 절차는 docs/design/systems/01-server.md "이미지 업데이트"
    image: itzg/minecraft-server:2026.11.0-java25
    container_name: mc
    restart: unless-stopped
    # 종료 시 월드 저장 시간 확보
    stop_grace_period: 1m
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:?.env에 MC_VERSION을 설정하세요}
      MEMORY: 6G
      TZ: Asia/Seoul
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      # Java4Shell(CVE-2026-114938) 완화. 2026.11.0 이미지에는 자동 적용이 없어서 직접 넣는다.
      # 자동 적용(FIX_JAVA4SHELL_EXPLOIT)이 들어간 릴리스로 올릴 때 이 줄을 뺀다.
      JVM_XX_OPTS: "-XX:-UseBASE64Intrinsics"
      # 관리 API(api)와 같은 값을 쓴다. RCON은 compose 내부 네트워크에서만 접근한다.
      RCON_PASSWORD: ${RCON_PASSWORD:?.env에 RCON_PASSWORD를 설정하세요}
    ports:
      # 외부 공개는 이 포트 하나만. RCON(25575)은 넣지 않는다.
      - "${MC_PORT:?.env에 MC_PORT를 설정하세요}:25565"
    volumes:
      - ./data:/data

  # 관리 API (읽기 전용). 사양: docs/design/systems/04-api.md
  api:
    build:
      context: ./api
      target: runtime
    image: minecraft-devops-api:local
    container_name: api
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      API_TOKEN: ${API_TOKEN:?.env에 API_TOKEN을 설정하세요}
      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?.env에 RCON_PASSWORD를 설정하세요}
      BACKUP_DIR: /backups
    ports:
      # 외부에 공개하지 않는다. 로컬과 Tailscale IP에만 바인딩
      - "127.0.0.1:${API_PORT:?.env에 API_PORT를 설정하세요}:8000"
      - "${API_TAILSCALE_IP:?.env에 API_TAILSCALE_IP를 설정하세요}:${API_PORT}:8000"
    volumes:
      # 최근 백업 조회용. 읽기 전용. data/와 docker.sock은 마운트하지 않는다.
      - ./backups:/backups:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
