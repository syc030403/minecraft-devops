# 저장소 검사 (보조). 푸시 전 로컬 검증은 그대로 한다.
# 기준: docs/design/verification.md. CLAUDE.local.md의 로컬 점검 문자열은 공개할 수 없어 여기서 검사하지 않는다.
name: check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # compose.yaml 필수 변수용 더미 값. 실제 포트를 쓰지 않는다.
      MC_PORT: "25565"
      MC_VERSION: LATEST
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 도구 버전
        run: |
          docker compose version
          shellcheck --version
          jq --version

      - name: V6 compose 문법
        run: docker compose config -q

      - name: V7 shellcheck
        run: shellcheck scripts/*.sh

      - name: V7 set -euo pipefail
        run: |
          missing=0
          for f in scripts/*.sh; do
            if ! grep -q '^set -euo pipefail' "$f"; then
              echo "::error file=$f::set -euo pipefail 없음"
              missing=1
            fi
          done
          exit "$missing"

      - name: V2 RCON(25575) 공개 없음
        run: |
          n=$(docker compose config --format json \
            | jq '[.services[].ports[]? | select(.target == 25575 or (.published | tostring) == "25575")] | length')
          echo "25575 publish: $n"
          test "$n" -eq 0

      - name: V1 외부 공개 포트는 하나
        run: |
          n=$(docker compose config --format json \
            | jq '[.services[].ports[]? | select((.host_ip // "") == "" or .host_ip == "0.0.0.0")] | length')
          echo "외부 공개 포트: $n"
          test "$n" -eq 1

      - name: V3·V5 비밀값·운영 데이터가 git에 없음
        run: |
          files=$(git ls-files .env CLAUDE.local.md data/ backups/)
          if [ -n "$files" ]; then
            echo "::error::git에 있으면 안 되는 파일: $files"
            exit 1
          fi

      - name: V4 사용자 홈 경로 없음
        run: |
          if git grep -nE '/home/[A-Za-z0-9_]'; then
            echo "::error::공개 파일에 사용자 홈 경로가 있음"
            exit 1
          fi
